{% extends 'base.html' %}

{% block title %}Password Changed - AI Study Hub{% endblock %}
{% block page_title %}Password Changed{% endblock %}

{% block content %}
<div style="max-width: 440px; margin: 3rem auto; text-align: center;">
    <div class="card" style="padding: 2.5rem 2rem;">
        <div style="width: 60px; height: 60px; background: rgba(16, 185, 129, 0.15); color: var(--accent-success); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.8rem; margin: 0 auto 1rem;">
            ✓
        </div>
        <h2 style="font-size: 1.4rem; font-weight: 700; margin-bottom: 0.5rem;">Password Updated</h2>
        <p style="color: var(--text-secondary); margin-bottom: 1.5rem;">Your password has been changed successfully!</p>
        <a href="{% url 'accounts:profile' %}" class="btn btn-primary">Return to Profile</a>
    </div>
</div>
{% endblock %}
